[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dockdack"
version = "0.1.0"
description = "Safe Kiwoom REST API broker client for Korean and US stocks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
conditions = [
    "websockets>=15,<16",
]

[tool.setuptools.packages.find]
include = ["dockdack*"]
