[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dockdack"
version = "0.1.0"
description = "Safe Kiwoom REST API broker client for Korean and US stocks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "tzdata>=2025.2",
    "exchange-calendars>=4.13.2,<5",
]

[project.scripts]
dockdack = "dockdack.cli:main"
dockdack-gui = "dockdack.v00_app:main"
dockdack-prototype-worker = "dockdack.signals.worker:main"
dockdack-maintenance = "dockdack.maintenance:main"
dockdack-research = "dockdack.research_tools:main"

[project.optional-dependencies]
ml = [
    "torch>=2.6,<3",
    "numpy>=2.0,<3",
    "matplotlib>=3.9,<4",
]
gui = [
    "PySide6>=6.10,<7",
]
prototype = [
    "numpy>=2.0,<3",
    "catboost==1.2.10",
]
conditions = [
    "websockets>=15,<16",
]
research = [
    "torch>=2.6,<3",
    "numpy>=2.0,<3",
    "matplotlib>=3.9,<4",
    "catboost==1.2.10",
    "lightgbm==4.6.0",
]
dev = [
    "build>=1.2,<2",
    "setuptools>=68",
]

[tool.setuptools.packages.find]
include = ["dockdack*"]

[tool.setuptools.package-data]
dockdack = ["assets/*.svg", "assets/*.ico"]
