name: Offline regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONNOUSERSITE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.13 --extra gui --extra prototype --extra conditions --extra research --extra dev
      - run: uv run --no-sync python scripts/check.py
      - run: uv build --wheel
